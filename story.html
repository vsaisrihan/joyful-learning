<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyful Learn Story</title>
    <script src="stories.js"></script>
    <script src="long-stories.js"></script>
    <script src="components.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main-header></main-header>
    <main class="container">
        <div class="content">
            <div class="story-image-card">
                <div class="tag" id="storyAge"></div>
                <img id="storyImage" class="story-image" alt="">
            </div>
            <div>
                <article class="story-card">
                    <h1 id="title"></h1>
                    <p id="story"></p>
                </article>
                <div class="buttons">
                    <button class="btn read-btn" type="button" onclick="readStory()">Read Aloud</button>
                    <button class="btn translate-btn" type="button" onclick="translateStory()">Translate to
                        Telugu</button>
                </div>
            </div>
        </div>
    </main>
    <main-footer></main-footer>
    <script>
        const storyId = new URLSearchParams(window.location.search).get("story");
        const selectedStory = (window.JOYFUL_EXTRA_STORIES || []).find(item => item.id === storyId);
        let showingTelugu = false;

        if (selectedStory) {
            document.title = `${selectedStory.title} | Joyful Learn`;
            document.getElementById("title").textContent = selectedStory.title;
            document.getElementById("story").textContent = selectedStory.story;
            document.getElementById("storyAge").textContent = selectedStory.age;
            document.getElementById("storyImage").src = selectedStory.image;
            document.getElementById("storyImage").alt = selectedStory.title;
        } else {
            window.location.replace("index.html#stories");
        }

        function readStory() {
            speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(document.getElementById("story").textContent);
            speech.lang = showingTelugu ? "te-IN" : "en-US";
            speechSynthesis.speak(speech);
        }

        function translateStory() {
            const story = document.getElementById("story");
            const button = document.querySelector(".translate-btn");
            story.textContent = showingTelugu ? selectedStory.story : selectedStory.telugu;
            button.textContent = showingTelugu ? "Translate to Telugu" : "Show English";
            showingTelugu = !showingTelugu;
        }
    </script>
</body>

</html>
