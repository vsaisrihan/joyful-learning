<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Story | Joyful Learn</title>
    <script src="components.js"></script>
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FP3E6RRYEH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-FP3E6RRYEH');
    </script>
</head>

<body class="story-submit-page">
    <main-header></main-header>

    <main class="story-submit-page-wrap">
        <section class="story-submit-hero">
            <span>Share Your Story</span>
            <h1>Add a Story</h1>
            <p>
                Submit your story idea with a title, description, thumbnail, and full story text.
                When you press submit, your email app will open with everything ready to send.
            </p>
        </section>

        <section class="story-submit-panel">
            <form id="storySubmissionForm" class="story-submit-form">
                <div class="form-group">
                    <label for="submitterName">Your Name</label>
                    <input id="submitterName" name="submitterName" type="text" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="submitterEmail">Your Email</label>
                    <input id="submitterEmail" name="submitterEmail" type="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="submittedStoryTitle">Story Title</label>
                    <input id="submittedStoryTitle" name="storyTitle" type="text" placeholder="The Magical Mango Tree" required>
                </div>

                <div class="form-group">
                    <label for="submittedStoryDescription">Short Description</label>
                    <input id="submittedStoryDescription" name="storyDescription" type="text" placeholder="A short, exciting summary" required>
                </div>

                <div class="form-group">
                    <label for="submittedStoryThumbnail">Thumbnail Image URL</label>
                    <input id="submittedStoryThumbnail" name="storyThumbnail" type="url" placeholder="https://example.com/story-image.jpg">
                </div>

                <div class="form-group">
                    <label for="submittedStoryAge">Age Group</label>
                    <input id="submittedStoryAge" name="storyAge" type="text" placeholder="5-7 Years">
                </div>

                <div class="form-group form-group-full">
                    <label for="submittedStoryText">Full Story</label>
                    <textarea id="submittedStoryText" name="storyText" placeholder="Write or paste the full story here..." required></textarea>
                </div>

                <button class="story-submit-button" type="submit">Submit Story by Email</button>
                <p id="storySubmitStatus" class="story-submit-status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <main-footer></main-footer>
</body>

</html>
